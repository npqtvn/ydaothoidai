# Mỗi lần bạn bấm "Lưu" trong trang quản trị (hoặc push code), GitHub tự build và đăng web lên GitHub Pages.
name: Đăng website lên GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Đang chạy tạm ở https://npqtvn.github.io/ydaothoidai/
      # Khi gán tên miền ydaothoidai.com: xóa 2 dòng dưới (xem HUONG-DAN.md mục 4)
      BASE_PATH: /ydaothoidai
      SITE_URL: https://npqtvn.github.io
    steps:
      - uses: actions/checkout@v7
      - uses: withastro/action@v6
        with:
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
